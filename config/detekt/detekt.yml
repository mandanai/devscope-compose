style:
  MaxLineLength:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/*Test/**', '**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**', '**/samples/**']
complexity:
  TooManyFunctions:
    excludes: ['**/commonTest/**', '**/androidHostTest/**', '**/iosTest/**', '**/samples/**']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
