name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Format, static analysis and public API
        run: ./gradlew spotlessCheck detekt checkKotlinAbi --no-daemon

  android-and-common:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Host tests and common metadata
        run: ./gradlew testAndroidHostTest compileCommonMainKotlinMetadata --no-daemon
      - name: Android sample
        run: ./gradlew :samples:androidApp:assembleDebug :samples:androidApp:assembleRelease --no-daemon
      - name: Noop twins stay binary compatible
        run: scripts/check-noop-abi.sh

  apple:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --no-daemon
      - name: Link sample framework
        run: ./gradlew :samples:composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS sample app
        run: >
          xcodebuild -project samples/iosApp/iosApp.xcodeproj -target iosApp
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

  publication-dry-run:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Validate artifacts
        run: |
          set -e
          for m in core flow navigation network-ktor network-okhttp database-sqldelight diagnostics export ui-compose; do
            dir="$HOME/.m2/repository/dev/chayaphon/journeyscope/devscope-$m"
            test -d "$dir" || { echo "missing $dir"; exit 1; }
            ls "$dir"/*/*.pom "$dir"/*/*.module >/dev/null
          done

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  agent-skill:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Skill references are in sync with ai/
        run: |
          sh scripts/sync-skill-references.sh
          git diff --exit-code -- skills
          test -z "$(git status --porcelain -- skills)"
