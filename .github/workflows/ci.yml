name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Format, static analysis and public API
        run: ./gradlew spotlessCheck detekt checkKotlinAbi --no-daemon

  android-and-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Host tests and common metadata
        run: ./gradlew testAndroidHostTest compileCommonMainKotlinMetadata --no-daemon
      - name: Android sample
        run: ./gradlew :samples:androidApp:assembleDebug --no-daemon

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --no-daemon
      - name: Link sample framework
        run: ./gradlew :samples:composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS sample app
        run: >
          xcodebuild -project samples/iosApp/iosApp.xcodeproj -target iosApp
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

  publication-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Validate artifacts
        run: |
          set -e
          for m in core flow navigation network-ktor network-okhttp database-sqldelight diagnostics export ui-compose; do
            dir="$HOME/.m2/repository/dev/journeyscope/devscope-$m"
            test -d "$dir" || { echo "missing $dir"; exit 1; }
            ls "$dir"/*/*.pom "$dir"/*/*.module >/dev/null
          done

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
