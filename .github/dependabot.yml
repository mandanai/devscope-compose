version: 2

# Dependabot alerts and security updates are repository settings; enable them under
# Settings > Advanced Security. Kotlin, AGP and Compose are version-coupled, so majors are manual.
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: org.jetbrains.kotlin*
        update-types: ["version-update:semver-major"]
      - dependency-name: com.android.*
        update-types: ["version-update:semver-major"]
      - dependency-name: org.jetbrains.compose*
        update-types: ["version-update:semver-major"]
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      compose:
        patterns: ["org.jetbrains.compose*", "org.jetbrains.androidx*"]
      androidx:
        patterns: ["androidx.*"]
      networking:
        patterns: ["io.ktor*", "com.squareup.okhttp3*"]
      sqldelight:
        patterns: ["app.cash.sqldelight*"]
      build-tooling:
        patterns: ["com.diffplug.spotless*", "dev.detekt*", "com.vanniktech*"]

  - package-ecosystem: gradle
    directory: /build-logic
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
