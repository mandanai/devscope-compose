site_name: JourneyScope
site_description: Runtime debugging for Kotlin Multiplatform apps. See the whole journey of an operation, not just its HTTP calls.
site_url: https://mandanai.github.io/devscope-compose/
repo_url: https://github.com/mandanai/devscope-compose
repo_name: mandanai/devscope-compose
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: build/site
strict: true

exclude_docs: |
  CONTRIBUTING.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Overview: getting-started.md
      - Android: android-integration.md
      - iOS: ios-integration.md
  - Instrument:
      - Instrumentation: instrumentation.md
      - Network: network.md
      - Flow: flow.md
      - Navigation: navigation.md
      - Database: database.md
  - Inspect and share:
      - Inspector UI: ui.md
      - UI verification: ui-verification.md
      - Diagnostics: diagnostics.md
      - Export: export.md
  - Ship:
      - Release safety: release.md
      - Publishing: publishing.md
      - Release readiness: release-readiness.md
  - Reference:
      - Architecture: architecture.md
      - Modules: modules.md
      - API: api.md
      - Performance: performance.md
      - Privacy and security: privacy-security.md
  - Project:
      - Sample walkthrough: sample-walkthrough.md
      - Development: development.md
      - Changelog: CHANGELOG.md
